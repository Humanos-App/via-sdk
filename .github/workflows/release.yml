name: release

# A GitHub release, created by hand from the GitHub UI, publishes the package to npm once CI passes.
# Nothing else publishes: a push or a tag alone does not.
# The version comes from the release tag (v1.2.3 → 1.2.3). The dist-tag comes from package.json:
# `main` has none (→ latest); `v04` sets publishConfig.tag = "next".
on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Set version (release tag)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # prepublishOnly runs the typecheck and the tests again; prepack rebuilds dist/.
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
