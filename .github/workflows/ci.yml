name: ci

on:
  push:
    branches: [main, v04]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      # `pretest` builds dist/ first; the build-contract suite then checks the built package.
      - run: npm test
